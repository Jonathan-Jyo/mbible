<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기기 진단</title>
<!--
  diag.html — 이 기기에서 앱이 왜 멈추는지 한 화면에 모은다 (v4.33.1, 2026-11-26)
  S45 Pro(안드로이드 10 · 구글 WebView/Chrome 없음)에서 성경읽기가 「불러오는 중」에 멈춘 일을 가르려고 만들었다.
  ⚠ 옛 WebView 에서도 떠야 한다 — var · function 만, 새 CSS(변수·inset·gap·min()) 없이.
-->
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ec; color: #22242b; }
  body { font: 15px/1.55 sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 28px; }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  .sub { color: #6b7080; font-size: 13px; margin: 0 0 12px; }
  .verdict { border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; font-weight: bold; }
  .v-bad { background: #fde8e4; border: 1px solid #e8a597; color: #8a2a17; }
  .v-ok { background: #e4f4ea; border: 1px solid #94cfa8; color: #1d5a31; }
  .v-warn { background: #fdf3dc; border: 1px solid #e3c47e; color: #6b4d0c; }
  .sec { background: #fffdf6; border: 1px solid #e3ded0; border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; }
  .sec h2 { font-size: 15px; margin: 0 0 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td { padding: 4px 2px; border-top: 1px solid #efeadc; vertical-align: top; word-break: break-all; }
  td.k { width: 46%; color: #4a4e5a; }
  .ok { color: #1d7a3f; font-weight: bold; }
  .no { color: #b3301a; font-weight: bold; }
  .mid { color: #8a6a14; font-weight: bold; }
  .btn { display: block; width: 100%; box-sizing: border-box; margin: 10px 0 0; padding: 13px 10px; border-radius: 12px;
         border: 1px solid #c9b27a; background: #d9b45b; color: #1c1608; font-size: 16px; font-weight: bold; text-align: center; text-decoration: none; }
  .btn.alt { background: #efe9da; border-color: #d8d0bd; color: #22242b; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #efe9da; border-radius: 8px; padding: 8px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🩺 기기 진단</h1>
  <p class="sub">이 화면을 사진으로 찍어(위에서 아래까지) 보내 주세요. 「결과 복사」로 글로 보내셔도 됩니다.</p>
  <div id="gone" class="verdict v-bad" style="display:none"></div>
  <div id="verdict" class="verdict v-warn">검사하는 중…</div>
  <div id="soft" class="sec" style="display:none"></div>
  <div id="out"></div>
  <a class="btn" href="#" id="copy">📋 결과 복사</a>
  <a class="btn alt" href="#" id="clear-log" style="display:none">🧹 꺼짐·소리 기록 지우기</a>
  <a class="btn alt" href="index.html">← 첫화면으로</a>
  <pre id="text"></pre>
</div>
<script src="js/boot-guard.js?v=4"></script>
<script src="js/version.js"></script>
<script>
(function () {
  "use strict";
  var rows = [];            // [구역, 이름, 값, 상태(ok|no|mid|"")]
  var fatal = [], warn = [];
  function row(sec, k, v, st) { rows.push([sec, k, String(v), st || ""]); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;"; }); }
  function mb(n) { return n > 0 ? (n / 1048576).toFixed(n > 104857600 ? 0 : 1) + "MB" : "0"; }
  function can(src) { try { new Function(src); return true; } catch (e) { return false; } }

  // ── 기기 · WebView ──
  var ua = navigator.userAgent || "";
  var cm = /Chrome\/([\d.]+)/.exec(ua), cv = cm ? +cm[1].split(".")[0] : 0;
  var am = /Android\s([\d.]+)/.exec(ua);
  var V = window.APP_VERSION || {};
  row("기기", "앱 판", (window.MINI_EDITION ? "mini " + V.mini : window.LIGHT_EDITION ? "light " + V.light : "정식 " + V.name) || "?");
  row("기기", "안드로이드", am ? am[1] : "알 수 없음");
  row("기기", "WebView(화면 부품)", cm ? cm[1] : "알 수 없음", cv >= 88 ? "ok" : (cv >= 80 || (window.MINI_EDITION && cv >= 74)) ? "mid" : "no");
  row("기기", "모델(이름표)", (/;\s*([^;)]+)\s+Build\//.exec(ua) || [])[1] || "알 수 없음");
  row("기기", "화면", screen.width + "×" + screen.height + " · 배율 " + (window.devicePixelRatio || 1) + " · 창 " + window.innerWidth + "×" + window.innerHeight);
  row("기기", "메모리(대략)", navigator.deviceMemory ? navigator.deviceMemory + "GB" : "알 수 없음");
  row("기기", "처리기 수", navigator.hardwareConcurrency || "알 수 없음");
  // 소형폰 판(mini)은 빌드 때 스크립트를 크롬 74 문법으로 바꿔 둔다(v4.33.2) — 74 판까지는 문법 때문에 멈추지 않는다
  var MINI = !!window.MINI_EDITION, MINI_MIN = 74, MINI_LOWERED = 85;
  if (!cm) warn.push("WebView 판을 읽지 못했습니다");
  else if (MINI) { if (cv < MINI_MIN) fatal.push("WebView " + cv + " 판 — 소형폰 판도 " + MINI_MIN + " 판보다 낮으면 스크립트를 읽지 못합니다"); }
  else if (cv < 80) fatal.push("WebView " + cv + " 판 — 이 앱 스크립트(80 판 이상 문법)를 읽지 못합니다");
  else if (cv < 88) warn.push("WebView " + cv + " 판 — 화면 몇 곳의 모양이 어긋날 수 있습니다(88 판 이상 권장)");

  // ── 문법 (모르면 그 스크립트 파일 전체가 안 돈다) ──
  var SYN = [
    ["화살표 함수 · let/const", "let a = () => 1;", 49],
    ["async/await", "async function f(){ await 1; }", 55],
    ["객체 펼치기 {...a}", "var a={}; var b={...a};", 60],
    ["?. 선택적 연결", "var a={}; a?.b;", 80],
    ["?? 널 병합", "var a = null ?? 1;", 80],
    ["#비공개 필드", "class A { #x = 1; }", 74],
    ["??= ||= 논리 대입", "var a; a ??= 1;", 85],
    ["유니코드 정규식 \\p{L}", "/\\p{L}/u;", 64],
    ["정규식 뒤보기 (?<=)", "/(?<=a)b/;", 62]
  ];
  for (var i = 0; i < SYN.length; i++) {
    var okS = can(SYN[i][1]);
    // mini 는 74 판보다 새 문법(?. ?? 논리 대입)을 빌드 때 바꿔 두었다 — 기기가 몰라도 괜찮다
    var lowered = MINI && !okS && SYN[i][2] > MINI_MIN && SYN[i][2] <= MINI_LOWERED;
    row("문법", SYN[i][0] + " (" + SYN[i][2] + "+)", okS ? "됨" : lowered ? "안 됨 — 소형폰 판은 빌드 때 바꿔 둠(괜찮음)" : "안 됨", okS ? "ok" : lowered ? "mid" : "no");
    if (!okS && !lowered && SYN[i][2] <= 85) fatal.push("문법 「" + SYN[i][0] + "」을 모릅니다 — 이것을 쓰는 화면이 통째로 멈춥니다");
  }

  // ── 기능 ──
  function has(name, v) { row("기능", name, v ? "있음" : "없음", v ? "ok" : "no"); return v; }
  has("Promise", typeof Promise !== "undefined");
  has("fetch", typeof fetch === "function");
  has("IntersectionObserver", typeof IntersectionObserver !== "undefined");
  has("Intl.Collator(숫자 정렬)", typeof Intl !== "undefined" && !!Intl.Collator);
  has("Object.fromEntries (73+)", typeof Object.fromEntries === "function");
  has("Promise.allSettled (76+)", typeof Promise !== "undefined" && typeof Promise.allSettled === "function");
  var cssOk = typeof CSS !== "undefined" && CSS.supports;
  row("기능", "CSS inset (87+)", cssOk && CSS.supports("inset", "0") ? "됨" : "안 됨", cssOk && CSS.supports("inset", "0") ? "ok" : "mid");
  row("기능", "CSS aspect-ratio (88+)", cssOk && CSS.supports("aspect-ratio", "1") ? "됨" : "안 됨", cssOk && CSS.supports("aspect-ratio", "1") ? "ok" : "mid");
  row("기능", "CSS dvh (108+)", cssOk && CSS.supports("height", "1dvh") ? "됨" : "안 됨(대체값 있음)", cssOk && CSS.supports("height", "1dvh") ? "ok" : "mid");

  // ── 앱 부품 ──
  var C = window.Capacitor;
  var native = !!(C && C.isNativePlatform && C.isNativePlatform());
  row("앱", "안드로이드 앱 안에서", native ? "예" : "아니오(브라우저)", native ? "ok" : "mid");
  if (C && C.Plugins) {
    var names = [];
    for (var p in C.Plugins) if (Object.prototype.hasOwnProperty.call(C.Plugins, p)) names.push(p);
    row("앱", "부품 수", names.length);
  }

  // ── 저장 ──
  var lsOk = false;
  try { localStorage.setItem("__diag", "1"); lsOk = localStorage.getItem("__diag") === "1"; localStorage.removeItem("__diag"); } catch (e) { lsOk = false; row("저장", "localStorage 오류", e && e.message, "no"); }
  row("저장", "localStorage 쓰기", lsOk ? "됨" : "안 됨", lsOk ? "ok" : "no");
  if (!lsOk) fatal.push("기록 저장소(localStorage)에 쓸 수 없습니다 — 저장 공간이 꽉 찼거나 막혔습니다");
  try { row("저장", "localStorage 항목 수", localStorage.length); } catch (e) { /* 위에서 알렸다 */ }

  // 검사가 끝날 때마다 다시 그린다 — 느린 폰에서 하나가 끝나지 않아도 아는 것은 보이게
  var pending = 0;
  function done() { pending--; render(); }

  pending++;
  try {
    var q = indexedDB.open("__diag", 1);
    q.onsuccess = function () { row("저장", "IndexedDB 열기", "됨", "ok"); try { q.result.close(); indexedDB.deleteDatabase("__diag"); } catch (e) { /* 지워지지 않아도 그만 */ } done(); };
    q.onerror = function () { row("저장", "IndexedDB 열기", "안 됨 — " + (q.error && q.error.message), "no"); warn.push("IndexedDB 를 열 수 없습니다 — 찬양 음원·자료 저장이 안 됩니다"); done(); };
    q.onblocked = function () { row("저장", "IndexedDB 열기", "막힘", "mid"); done(); };
  } catch (e) { row("저장", "IndexedDB 열기", "없음 — " + e.message, "no"); done(); }

  if (navigator.storage && navigator.storage.estimate) {
    pending++;
    navigator.storage.estimate().then(function (s) {
      var free = (s.quota || 0) - (s.usage || 0);
      row("저장", "앱이 쓸 수 있는 공간(대략)", mb(s.quota) + " 중 " + mb(s.usage) + " 사용 · 남음 " + mb(free), free < 52428800 ? "no" : free < 209715200 ? "mid" : "ok");
      if (free < 52428800) fatal.push("앱이 쓸 수 있는 저장 공간이 거의 없습니다(" + mb(free) + ") — 내부 저장 공간을 비워 주세요");
      done();
    }, function () { row("저장", "저장 공간", "읽지 못함", "mid"); done(); });
  } else row("저장", "저장 공간", "이 WebView 는 알려 주지 않습니다", "mid");

  // 화면이 거듭 꺼져 앱이 이 화면으로 열었으면(?gone=횟수, v4.33.4) — 알리고, 큰 자료 읽기는 건너뛴다(또 꺼지지 않게)
  var goneN = +((/[?&]gone=(\d+)/.exec(location.search) || [])[1] || 0);
  if (goneN) {
    var g = document.getElementById("gone");
    g.style.display = "block";
    g.innerHTML = "⚠ 화면이 1분 안에 " + goneN + "번 꺼져서, 읽던 화면 대신 이 진단 화면으로 열었습니다.<br>" +
      "<span style=\"font-weight:normal\">아래 「화면 꺼짐」 기록을 사진으로 찍어 보내 주세요. 숨은 재생 화면도 띄우지 않았습니다.</span>";
    row("화면 꺼짐", "이번에 연 까닭", "1분 안에 " + goneN + "번 꺼짐 → 진단 화면으로", "no");
  }

  // ── 성경 자료 읽기 (요한복음 = 43) ──
  if (goneN) row("자료", "요한복음 자료 읽기", "건너뜀(화면이 거듭 꺼져서)", "mid");
  else (function () {
  pending++;
  var t0 = Date.now();
  var x = new XMLHttpRequest();
  x.open("GET", "data/bible-db/43.json", true);
  x.onload = function () {
    var t1 = Date.now();
    if (x.status && x.status !== 200 && x.status !== 0) { row("자료", "요한복음 자료", "못 읽음 — " + x.status, "no"); fatal.push("성경 자료 파일을 읽지 못했습니다(" + x.status + ")"); return done(); }
    var txt = x.responseText || "";
    row("자료", "요한복음 자료 읽기", mb(txt.length) + " · " + (t1 - t0) + "ms", (t1 - t0) < 3000 ? "ok" : "mid");
    try {
      var t2 = Date.now(); var j = JSON.parse(txt);
      var n = j && j.verses ? Object.keys(j.verses).length : 0;
      row("자료", "풀기(JSON)", n + "절 · " + (Date.now() - t2) + "ms", "ok");
    } catch (e) { row("자료", "풀기(JSON)", "실패 — " + e.message, "no"); fatal.push("성경 자료를 풀지 못했습니다 — " + e.message); }
    done();
  };
  x.onerror = function () { row("자료", "요한복음 자료", "읽기 오류", "no"); fatal.push("성경 자료 파일을 읽지 못했습니다"); done(); };
  x.send();
  })();

  // 앞 화면에서 멈춤 감시가 모아 둔 오류가 있으면
  try {
    var last = sessionStorage.getItem("boot-guard-errors");
    if (last) row("앞 화면 오류", "기록", last, "no");
  } catch (e) { /* 없다 */ }

  // 화면이 꺼진 기록(앱 본체 RendererGuard — v4.33.3) · 앱 전체가 꺼진 기록(LifeLog — v4.33.6, 소형폰 판)
  var RL = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.RendererLog;
  if (RL && RL.list && window.RendererGoneText) {
    pending++;
    try {
      RL.list().then(function (r) {
        var a = (r && r.items) || [];
        if (!a.length) row("화면 꺼짐", "기록", "없음", "ok");
        var memAt = {}, nMem = 0, nCrash = 0, nApp = 0;
        for (var i = 0; i < a.length; i++) {
          var o = a[i], t = window.RendererGoneText(o);
          // 한 번 꺼질 때 보던 화면·재생 화면이 같은 시각으로 함께 적힌다 — 시각으로 한 번만 센다
          if (o.who === "app") { if (o.fg || o.playing) nApp++; }
          else if (!memAt[o.at]) { memAt[o.at] = 1; if (o.crash) nCrash++; else nMem++; }
          row("화면 꺼짐", t.when + " · " + t.who, t.why + " · " + t.page + (o.who === "app" ? "" : " · 우선순위 " + t.prio) + (t.mem ? " · " + t.mem : ""),
            o.crash || (o.who === "app" && o.fg) ? "no" : "mid");
          if (o.hist && o.hist.length) row("화면 꺼짐", "  └ 꺼지기 전 흐름", histText(o.hist), "mid");
          if (o.acts && o.acts.length) row("화면 꺼짐", "  └ 꺼지기 전 일(최근 " + Math.min(ACTS_SHOW, o.acts.length) + ")", actsText(o.acts, o.at), "mid");
        }
        if (nApp) warn.push("앱 전체가 " + nApp + "번 갑자기 꺼졌습니다 — 「화면 꺼짐」의 그때 남은 메모리를 보세요");
        if (nMem) warn.push("화면이 " + nMem + "번 메모리 부족으로 정리됐습니다 — 다른 앱을 닫거나 기기를 다시 켜 보세요");
        if (nCrash) warn.push("화면 부품(WebView)이 " + nCrash + "번 스스로 멈췄습니다");
        done();
      }, function () { row("화면 꺼짐", "기록", "읽지 못함", "mid"); done(); });
    } catch (e) { row("화면 꺼짐", "기록", "읽지 못함 — " + e.message, "mid"); done(); }
  } else row("화면 꺼짐", "기록", "앱 안에서만 볼 수 있습니다", "");

  // 꺼지기 전 3분의 흐름(5초마다 [시각초, 이 앱 MB, 남은 MB, 부족 0/1]) — 30초 간격으로 줄여 보인다 (v4.33.7)
  var HIST_STEP = 6;
  function histText(h) {
    var last = h[h.length - 1], out = [];
    for (var i = 0; i < h.length; i += HIST_STEP) out.push(h[i]);
    if (out[out.length - 1] !== last) out.push(last);
    return out.map(function (e) {
      var ago = last[0] - e[0];
      return (ago ? ago + "초 전 " : "직전 ") + "앱 " + e[1] + "MB·남은 " + e[2] + "MB" + (e[4] >= 0 ? "·화면JS " + e[4] + "MB" : "") + (e[3] ? "(부족)" : "");
    }).join(" → ");
  }

  // 꺼지기 전 일(활동 기록 [시각초, 글]) — 마지막 기록 시각에서 몇 초 전인지 (v4.33.8)
  var ACTS_SHOW = 20;
  function actsText(a, at) {
    var end = Math.round((+at || 0) / 1000);
    return a.slice(-ACTS_SHOW).map(function (e) { var ago = end - e[0]; return (ago > 0 ? ago + "초 전 " : "직전 ") + e[1]; }).join(" / ");
  }

  // 성경읽기 설정 — 지금 역본 · 대조 · 인라인 주석 · 저장된 자료 목록(v4.33.8 — 무엇이 자료를 통째로 여는지)
  try {
    var pos = JSON.parse(localStorage.getItem("bible-reader-pos") || "null") || {};
    var set = JSON.parse(localStorage.getItem("bible-reader-settings") || "null") || {};
    var inl = JSON.parse(localStorage.getItem("bible-reader-inline-cmts") || "[]") || [];
    var meta = JSON.parse(localStorage.getItem("bible-bdb-meta") || "null");
    row("성경읽기", "지금 역본", (pos.version || "-") + (/^(bdb|cmt|org|dct|egw):/.test(pos.version || "") ? " (불러온 자료 — 통째로 연다)" : ""), /:/.test(pos.version || "") ? "mid" : "");
    row("성경읽기", "역본 대조", set.parallel ? "켜짐 · " + (set.parVersions || []).join(", ") : "꺼짐");
    row("성경읽기", "절 사이 주석(인라인)", inl.length ? inl.join(", ") + " (장마다 연다)" : "없음", inl.length ? "mid" : "");
    row("성경읽기", "주석·원어 칸", (localStorage.getItem("bible-reader-cmt") || "-") + " · 원어 " + (localStorage.getItem("bible-reader-org") || "-"));
    if (window.MINI_EDITION) row("저장된 자료", "목록", "소형폰 판은 쓰지 않습니다(성경 주석·원어·찬미가 자료를 열지 않음)");
    else if (meta && meta.length) for (var mi = 0; mi < meta.length; mi++) row("저장된 자료", meta[mi].id, meta[mi].name || "");
    else row("저장된 자료", "목록", meta ? "없음" : "아직 읽지 않음");
  } catch (e4) { row("성경읽기", "설정", "읽지 못함 — " + e4.message, "mid"); }

  // 시험 — 그림을 소프트웨어로 그리기(소형폰 판, v4.33.7). 켜고 끄면 앱 화면을 새로 만들고 이 화면으로 돌아온다
  if (RL && RL.softRender) {
    try {
      RL.softRender().then(function (o) {
        if (!o || !o.available) return;
        var box = document.getElementById("soft");
        box.style.display = "block";
        box.innerHTML = "<h2>🧪 시험 — 그림을 소프트웨어로 그리기</h2>" +
          "<div style=\"font-size:13.5px;color:#4a4e5a\">지금: <b>" + (o.on ? "켜짐" : "꺼짐") + "</b> — 켜면 그래픽 칩 없이 그립니다. " +
          "성경읽기에서 앱이 쓰는 몫이 계속 불어나는지 켜기 전·후로 비교해 주세요(스크롤이 조금 느려질 수 있습니다).</div>" +
          "<a class=\"btn alt\" href=\"#\" id=\"soft-btn\">" + (o.on ? "끄기(그래픽 칩으로 그리기)" : "켜기(소프트웨어로 그리기)") + "</a>";
        document.getElementById("soft-btn").onclick = function (e) {
          e.preventDefault();
          this.textContent = "바꾸는 중… 화면이 새로 열립니다";
          RL.setSoftRender({ on: !o.on });
        };
      }, function () { /* 없으면 그만 */ });
    } catch (e) { /* 앱 밖 */ }
  }
  // 앱 화면 상태에도 남긴다(결과 복사에 들어가게)
  if (RL && RL.softRender) { try { RL.softRender().then(function (o) { if (o && o.available) { row("메모리", "그림을 소프트웨어로(시험)", o.on ? "켜짐" : "꺼짐"); render(); } }); } catch (e) { /* 앱 밖 */ } }

  // 지금 폰의 메모리 사정(안드로이드가 알려 주는 값 — v4.33.6)
  if (RL && RL.memNow) {
    pending++;
    try {
      RL.memNow().then(function (m) {
        row("메모리", "폰 전체", m.totalMB + "MB");
        row("메모리", "지금 남은 메모리", m.availMB + "MB", m.low ? "no" : m.availMB < m.thresholdMB * 2 ? "mid" : "ok");
        row("메모리", "안드로이드가 「부족」으로 보는 기준", m.thresholdMB + "MB 아래");
        row("메모리", "메모리 부족 신호", m.low ? "켜짐" : "꺼짐", m.low ? "no" : "ok");
        row("메모리", "이 앱이 쓰는 몫(화면 부품 제외)", m.pssMB + "MB");
        if (m.low) warn.push("지금 폰의 메모리가 부족합니다(남은 " + m.availMB + "MB) — 다른 앱을 닫아 주세요");
        done();
      }, function () { row("메모리", "읽기", "실패", "mid"); done(); });
    } catch (e) { row("메모리", "읽기", "실패 — " + e.message, "mid"); done(); }
  }

  // 소리 기록(js/play-engine.js — 재생 중 오류 · 일찍 끝남, v4.33.6)
  var MEDIA_ERR = { 1: "중단됨", 2: "읽기 끊김(네트워크)", 3: "해독 실패(디코딩)", 4: "형식·주소를 못 씀" };
  try {
    var pl = JSON.parse(localStorage.getItem("play-log") || "[]");
    if (!pl.length) row("소리 기록", "기록", "없음", "ok");
    for (var k = 0; k < pl.length; k++) {
      var e = pl[k], d = new Date(e.at);
      var what = (e.kind === "retry" ? "끊겨서 그 자리부터 다시 받음 — " : "") +
        (e.kind === "error" || e.kind === "retry" ? "오류 " + e.code + " " + (MEDIA_ERR[e.code] || "") + (e.msg ? " — " + e.msg : "")
        : "다 듣기 전에 끝남");
      row("소리 기록", (d.getMonth() + 1) + "/" + d.getDate() + " " + d.toTimeString().slice(0, 8) + " · " + e.page,
        what + " · " + e.pos + "초 / " + (e.dur < 0 ? "?" : e.dur + "초") + " · 상태 " + e.net + "/" + e.ready + " · " + (e.title || e.file), "no");
    }
    if (pl.length) warn.push("소리가 " + pl.length + "번 중간에 끊겼습니다(다시 받은 것 포함) — 「소리 기록」을 보세요");
  } catch (e2) { row("소리 기록", "기록", "읽지 못함", "mid"); }

  // 이 앱이 남긴 로그의 경고·오류 끝부분(앱은 제 몫만 읽는다 — 안드로이드가 앱을 정리한 기록은 없다)
  var LOG_SHOW = 30;
  if (RL && RL.appLog) {
    pending++;
    try {
      RL.appLog().then(function (r) {
        // 이 폰이 늘 남기는 잡음(그래픽·코덱 목록·메모리 재기 경고)은 뺀다 — 음원 전달(TojesusMedia)·오류가 보이게
        var NOISE = /memtrack|memory consumption info|AudioCapabilities|VideoCapabilities|IMGSRV|GraphicExt|Gralloc|libboost_ext/;
        var lines = String((r && r.text) || "").split("\n").filter(function (l) { return /^\d\d-\d\d /.test(l) && !NOISE.test(l); });
        if (!lines.length) row("앱 로그", "경고·오류", "없음", "ok");
        lines = lines.slice(-LOG_SHOW);
        for (var j = 0; j < lines.length; j++) row("앱 로그", lines[j].slice(6, 18), lines[j].slice(19, 300), /\sE\//.test(lines[j]) || /^.{19}E\//.test(lines[j]) ? "no" : "");
        done();
      }, function (er) { row("앱 로그", "읽기", "실패 — " + (er && er.message), "mid"); done(); });
    } catch (e3) { row("앱 로그", "읽기", "실패 — " + e3.message, "mid"); done(); }
  }

  var HANG_MS = 10000;
  setTimeout(function () {
    if (pending > 0) { warn.push("끝나지 않은 검사 " + pending + "개 — 이 기기에서 그 기능이 응답하지 않습니다"); render(); }
  }, HANG_MS);

  function render() {
    var v = document.getElementById("verdict");
    if (pending > 0 && !fatal.length) { v.className = "verdict v-warn"; v.innerHTML = "검사하는 중… (남은 검사 " + pending + "개)"; }
    else if (fatal.length) { v.className = "verdict v-bad"; v.innerHTML = "멈추는 까닭으로 보이는 것:<br>· " + fatal.map(esc).join("<br>· "); }
    else if (warn.length) { v.className = "verdict v-warn"; v.innerHTML = "큰 문제는 없지만 살펴볼 것:<br>· " + warn.map(esc).join("<br>· "); }
    else { v.className = "verdict v-ok"; v.innerHTML = "이 기기에서 앱이 돌아갈 조건은 모두 갖췄습니다."; }
    // 구역마다 모아서 — 늦게 끝난 검사가 같은 구역을 두 번 만들지 않게(처음 나온 차례대로)
    var order = [], bySec = {};
    for (var i = 0; i < rows.length; i++) {
      if (!bySec[rows[i][0]]) { bySec[rows[i][0]] = []; order.push(rows[i][0]); }
      bySec[rows[i][0]].push(rows[i]);
    }
    var html = "", text = v.innerText + "\n";
    for (var q = 0; q < order.length; q++) {
      var sec = order[q], list = bySec[sec];
      html += "<div class=\"sec\"><h2>" + esc(sec) + "</h2><table>"; text += "\n[" + sec + "]\n";
      for (var w = 0; w < list.length; w++) {
        var r = list[w];
        html += "<tr><td class=\"k\">" + esc(r[1]) + "</td><td class=\"" + r[3] + "\">" + esc(r[2]) + "</td></tr>";
        text += r[1] + ": " + r[2] + "\n";
      }
      html += "</table></div>";
    }
    document.getElementById("out").innerHTML = html;
    document.getElementById("text").textContent = text + "\nUA: " + ua;
  }
  render();

  // 기록 지우기(v4.34.1) — 예전 판의 꺼짐·소리 기록이 맨 위 경고에 계속 세어지므로, 지우고 새로 지켜볼 수 있게
  var clr = document.getElementById("clear-log");
  if (RL && RL.clear) {
    clr.style.display = "block";
    clr.onclick = function (e) {
      e.preventDefault();
      if (!confirm("화면 꺼짐·소리 기록을 지울까요?\n(성경·찬양 자료나 읽은 기록은 지우지 않습니다)")) return;
      try { localStorage.removeItem("play-log"); } catch (e2) { /* 없으면 그만 */ }
      RL.clear().then(function () { location.reload(); }, function () { location.reload(); });
    };
  }

  document.getElementById("copy").onclick = function (e) {
    e.preventDefault();
    var pre = document.getElementById("text");
    pre.style.display = "block";
    var ok = false;
    try {
      var r = document.createRange(); r.selectNodeContents(pre);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      ok = document.execCommand("copy");
    } catch (err) { ok = false; }
    this.textContent = ok ? "✓ 복사했습니다 — 메신저에 붙여 넣어 보내 주세요" : "아래 글을 길게 눌러 복사해 주세요";
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>매일나눔</title>
  <meta name="theme-color" content="#0f1123">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="css/card-composer.css?v=1">
  <style>
    :root {
      --bg: #0f1123; --card: #181c33; --surface: #202544;
      --text: #e8e9f0; --dim: #8b90a8;
      --gold: #d9b45b; --accent: #7aa2e8; --share: #e88bb0;
      --line: rgba(255, 255, 255, 0.1);
      --tint-rgb: 255, 255, 255;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    :root[data-theme="light"] {
      --bg: #f6f4ec; --card: #fffdf6; --surface: #efe9da;
      --text: #22242b; --dim: #6b7080;
      --gold: #a9852f; --accent: #3f6bb5; --share: #c2497d;
      --line: rgba(0, 0, 0, 0.1);
      --tint-rgb: 0, 0, 0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      min-height: 100dvh;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px; background: var(--bg); border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 17px; font-weight: 800; flex: 1; }
    .hbtn.appnav { padding: 5px 7px; font-size: 12px; opacity: 0.75; }
    .hbtn {
      background: none; border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 6px 10px; font-size: 14px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    main { padding: 12px 14px calc(84px + var(--safe-bottom)); max-width: 640px; margin: 0 auto; }
    .page { display: none; }
    .page.show { display: block; }

    .slot-head, .grp-head {
      font-size: 14px; font-weight: 800; color: var(--gold);
      padding: 6px 2px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
    }
    .slot-cnt { font-weight: 400; color: var(--dim); font-size: 12px; margin-left: 4px; }
    .empty-line { color: var(--dim); font-size: 13px; text-align: center; padding: 12px 0; line-height: 1.7; }
    .grp { margin-bottom: 16px; }

    .vip-row {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
    }
    .vip-name { font-size: 15.5px; font-weight: 700; }
    .vip-sub { font-size: 12px; color: var(--dim); margin-top: 3px; }
    .vip-sub.overdue { color: var(--share); font-weight: 600; }
    .tag {
      display: inline-block; margin-left: 6px; padding: 1px 8px;
      border: 1px solid var(--line); border-radius: 20px;
      font-size: 10.5px; font-weight: 600; color: var(--dim); vertical-align: 1.5px;
    }
    .stage-bar {
      height: 4px; border-radius: 2px; background: rgba(var(--tint-rgb), 0.08);
      margin-top: 8px; overflow: hidden;
    }
    .stage-bar i { display: block; height: 100%; background: var(--share); border-radius: 2px; }

    .cal-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 12px; }
    .cal-head b { font-size: 16px; }
    .cal-head button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
    #cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 11px; color: var(--dim); padding: 4px 0; }
    .cal-cell {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; gap: 3px; cursor: pointer;
    }
    .cal-cell.today { border-color: var(--gold); }
    .cal-cell.picked { background: rgba(232, 139, 176, 0.15); border-color: var(--share); }
    .cds { min-height: 6px; }
    .cd { width: 5px; height: 5px; border-radius: 50%; display: inline-block; background: var(--share); }
    #cal-sum { text-align: center; color: var(--dim); font-size: 13px; margin-top: 8px; }
    #cal-detail { margin-top: 12px; }
    .cd-date { font-size: 14px; font-weight: 800; margin-bottom: 7px; }
    .cd-slot {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 12px; margin-bottom: 6px; font-size: 13.5px; line-height: 1.5;
    }

    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      display: flex; justify-content: space-around;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 8px 4px calc(8px + var(--safe-bottom));
    }
    .tabbar button {
      background: none; border: none; color: var(--dim); cursor: pointer;
      font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 10px;
    }
    .tabbar button .ico { font-size: 20px; }
    .tabbar button.on { color: var(--gold); font-weight: 700; }
    #add-btn {
      position: fixed; right: 16px; bottom: calc(76px + var(--safe-bottom)); z-index: 5;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--gold); color: #1c1608; border: none;
      font-size: 26px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .overlay {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.55);
    }
    .overlay.show { display: flex; }
    .sheet {
      width: 100%; max-width: 640px; max-height: 88dvh; overflow-y: auto;
      background: var(--bg); border-radius: 18px 18px 0 0;
      padding: 18px 16px calc(20px + var(--safe-bottom));
    }
    .sheet h3 { font-size: 16px; margin-bottom: 10px; }
    .f-label { display: block; font-size: 12px; color: var(--dim); margin: 12px 2px 5px; }
    .sheet input[type="text"], .sheet input[type="time"], .sheet input[type="number"], .sheet textarea, .sheet select {
      width: 100%; background: var(--card); border: 1px solid var(--line);
      color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit;
    }
    .sheet textarea { min-height: 72px; resize: vertical; }
    .f-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-gold.w100 { background: var(--gold); color: #1c1608; }
    /* 🎂 다가오는 생일 줄 — 금색 테두리로 살짝 강조 */
    .bday-row { border-color: var(--gold); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
    .sheet-actions button {
      flex: 1; border: none; border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 800; cursor: pointer;
    }
    .btn-ghost { background: var(--surface); color: var(--text); }
    .btn-gold { background: var(--gold); color: #1c1608; }
    .w100 { width: 100%; border: none; border-radius: 10px; padding: 11px 0; font-size: 14px; font-weight: 700; cursor: pointer; }
    .f-lock-note {
      margin-top: 7px; padding: 9px 11px;
      background: rgba(232, 139, 176, 0.08); border: 1px solid rgba(232, 139, 176, 0.3);
      border-radius: 10px; font-size: 12px; line-height: 1.6; color: var(--dim);
    }

    #d-meta { margin: 6px 0 12px; line-height: 2; }
    .stg { font-size: 11px; color: var(--dim); cursor: pointer; padding: 2px 3px; }
    .stg.on { color: var(--share); font-weight: 800; }
    .stg-sep { font-size: 10px; color: var(--dim); opacity: 0.5; }
    .item-tags .htag { display: inline-block; margin-right: 5px; color: var(--accent); font-size: 11.5px; font-weight: 600; }
    #d-contact { margin-bottom: 10px; }
    .c-line {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 12px; margin-bottom: 6px; font-size: 14px;
    }
    .c-line.dim { color: var(--dim); font-size: 12.5px; }
    .c-line.memo { white-space: pre-wrap; line-height: 1.6; font-size: 13.5px; }
    .c-act {
      display: inline-block; margin-left: 8px; padding: 2px 10px;
      border: 1px solid var(--accent); color: var(--accent);
      border-radius: 14px; font-size: 12px; text-decoration: none;
    }
    .d-sec { font-size: 12px; color: var(--dim); margin: 10px 2px 6px; }
    .log-line {
      font-size: 12.5px; color: var(--dim); padding: 5px 2px;
      border-bottom: 1px dashed rgba(var(--tint-rgb), 0.08); line-height: 1.5;
    }

    #pin-overlay .sheet { max-width: 380px; border-radius: 18px; margin-bottom: 20dvh; }
    #pin-overlay.show { align-items: center; }
    #pin-input { text-align: center; letter-spacing: 6px; font-size: 20px !important; }
    #pin-msg { font-size: 13px; color: var(--dim); line-height: 1.5; margin-bottom: 10px; }
    .pin-links { display: flex; justify-content: space-between; margin-top: 12px; }
    .pin-links button { background: none; border: none; color: var(--dim); font-size: 12px; text-decoration: underline; cursor: pointer; }

    .toast {
      position: fixed; left: 50%; bottom: calc(96px + var(--safe-bottom)); transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      padding: 10px 18px; border-radius: 24px; font-size: 13.5px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 40;
    }
    .toast.show { opacity: 1; }
      /* 보조창 오른쪽 위 ✕ 닫기 (js/tags.js가 자동으로 넣어 준다) */
    .sheet { position: relative; }
    .sheet-x {
      position: absolute; top: 10px; right: 12px; z-index: 2;
      background: none; border: none; color: var(--dim);
      font-size: 17px; line-height: 1; cursor: pointer; padding: 6px 8px;
    }
    .sheet-x:active { color: var(--text); }
    .sheet.has-sheet-x > h3 { padding-right: 34px; }
  </style>
</head>
<body>
  <header>
    <a class="hbtn" href="index.html" title="첫화면">🏠</a>
    <h1>💝 매일나눔</h1>
    <a class="hbtn appnav" href="pray.html" title="매일기도">🙏</a>
    <a class="hbtn appnav" href="praise.html" title="매일찬양"><svg viewBox="0 0 24 24" width="16" height="16" fill="#5ec9a8" aria-hidden="true"><path d="M9.6 3.4 21 1.1v3.2L9.6 6.6z"/><rect x="7.9" y="3.9" width="1.9" height="12.2" rx="0.9"/><rect x="19.1" y="1.6" width="1.9" height="12.2" rx="0.9"/><ellipse cx="5.4" cy="17.1" rx="3.7" ry="2.9"/><ellipse cx="16.6" cy="14.8" rx="3.7" ry="2.9"/></svg></a>
  </header>

  <main>
    <section class="page" id="page-today"><div id="today-body"></div></section>
    <section class="page" id="page-vips">
      <div style="margin-bottom:10px">
        <button id="import-card-btn" style="background:none;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer">📥 카드 받기</button>
        <input type="file" id="import-card-file" accept=".json,application/json" hidden>
      </div>
      <div id="vips-body"></div>
    </section>
    <section class="page" id="page-cal">
      <div class="cal-head"><button id="cal-prev">◀</button><b id="cal-title"></b><button id="cal-next">▶</button></div>
      <div id="cal-grid"></div>
      <div id="cal-sum"></div>
      <div id="cal-detail"></div>
    </section>
  </main>

  <button id="add-btn" title="VIP 카드 추가">＋</button>

  <nav class="tabbar">
    <button data-tab="today"><span class="ico">💝</span>오늘의 나눔</button>
    <button data-tab="vips"><span class="ico">📇</span>VIP 카드</button>
    <button data-tab="cal"><span class="ico">📅</span>달력</button>
    <button id="settings-btn" type="button"><span class="ico">⚙</span>설정</button>
  </nav>

  <!-- 상세 -->
  <div class="overlay" id="detail-overlay">
    <div class="sheet">
      <h3 id="d-name"></h3>
      <div id="d-meta"></div>
      <div id="d-contact"></div>
      <div class="sheet-actions">
        <button class="btn-ghost" id="d-verse">✦ 말씀카드</button>
        <button class="btn-ghost" id="d-praise">🎵 찬양</button>
        <button class="btn-gold" id="d-logbtn">💝 나눔 기록</button>
      </div>
      <div class="sheet-actions"><button class="btn-ghost w100" id="d-pray"></button></div>
      <div id="d-log"></div>
      <div class="sheet-actions">
        <button class="btn-ghost" id="d-del">삭제</button>
        <button class="btn-ghost" id="d-edit">수정</button>
        <button class="btn-ghost" id="d-sharecard">💌 카드 보내기</button>
        <button class="btn-ghost" id="d-close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 추가/수정 -->
  <div class="overlay" id="form-overlay">
    <div class="sheet">
      <h3 id="form-title">VIP 카드 추가</h3>
      <button type="button" class="btn-ghost w100" id="f-pick-contact" style="margin-top:4px">📇 휴대폰 연락처에서 불러오기</button>
      <div class="f-2col">
        <div><label class="f-label">이름</label><input type="text" id="f-name" autocomplete="off"></div>
        <div><label class="f-label">단계</label><select id="f-stage"></select></div>
      </div>
      <div class="f-2col">
        <div><label class="f-label">👨‍👩‍👧 가족대표 (대표자 이름)</label><input type="text" id="f-family" autocomplete="off"></div>
        <div><label class="f-label">성별</label><select id="f-gender"><option value="">미지정</option><option>남</option><option>여</option></select></div>
      </div>
      <div class="f-2col">
        <div><label class="f-label">📞 전화번호</label><input type="text" id="f-phone" inputmode="tel" autocomplete="off"></div>
        <div><label class="f-label">✉️ 이메일</label><input type="text" id="f-email" inputmode="email" autocomplete="off"></div>
      </div>
      <div class="f-2col">
        <div><label class="f-label">🎂 생년월일</label><input type="text" id="f-birth" placeholder="1980-01-01" autocomplete="off"></div>
        <div><label class="f-label">양력/음력</label><select id="f-birthcal"><option>양력</option><option>음력</option><option>음력(윤달)</option></select></div>
      </div>
      <label class="f-label">🏠 주소</label>
      <input type="text" id="f-addr" autocomplete="off">
      <label class="f-label">메모</label>
      <textarea id="f-memo" placeholder="관심사, 기도할 내용, 만남의 기록…"></textarea>
      <div class="f-lock-note">📇 연락처는 휴대폰 주소록처럼 <b>잠금 없이 이 기기에만</b> 저장됩니다.
        카드를 남에게 파일로 보낼 때만 전달용 비밀번호를 묻습니다.</div>
      <label class="f-label">해시태그 <span style="font-size:11px;color:var(--dim)">(비우면 자동)</span></label>
      <input type="text" id="f-tags" placeholder="#이웃 #직장" autocomplete="off">
      <div class="sheet-actions">
        <button class="btn-ghost" id="form-cancel">취소</button>
        <button class="btn-gold" id="form-save">저장</button>
      </div>
    </div>
  </div>

  <!-- ⚙ 설정 — 관리성 기능을 하단 오른쪽 한곳으로 (다른 앱과 같은 자리) -->
  <div class="overlay" id="settings-overlay">
    <div class="sheet">
      <h3>⚙ 설정</h3>
      <div style="font-size:12.5px;color:var(--dim);line-height:1.6;margin:6px 0 12px">
        연락처는 <b>잠그지 않습니다</b>. 휴대폰 주소록에 비밀번호를 걸지 않는 것과 같습니다.
      </div>
      <div id="set-legacy"></div>

      <div class="f-label" style="margin-top:18px">🎂 생일 알림</div>
      <div style="font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:8px">
        VIP 카드에 생년월일을 넣어 두면(양력·음력 모두) 그날 알려 드립니다.
        음력은 매년 그 음력 날짜의 양력 환산일로 계산됩니다.
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;margin-bottom:8px">
        <input type="checkbox" id="set-bday-on" style="width:auto"> 생일 알림 사용
      </label>
      <div class="f-2col">
        <div><label class="f-label" style="margin-top:0">알릴 시각</label><input type="time" id="set-bday-time" value="09:00"></div>
        <div><label class="f-label" style="margin-top:0">며칠 전 미리 (0=당일만)</label><input type="number" id="set-bday-lead" min="0" max="14" value="3"></div>
      </div>
      <div id="set-bday-status" style="font-size:12px;color:var(--dim);margin-top:8px"></div>
      <button class="btn-gold w100" id="set-bday-save" style="margin-top:8px">🎂 알림 저장</button>

      <div class="sheet-actions">
        <button class="btn-ghost" id="settings-close">닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/tags.js?v=9"></script>
  <script src="js/crypt.js?v=2"></script>
  <script src="js/card-exchange.js?v=2"></script>
  <script src="js/pray-store.js?v=5"></script>
  <script src="js/card-composer.js?v=4"></script>
  <script src="js/share-store.js?v=2"></script>
  <script src="js/share-app.js?v=16"></script>
</body>
</html>

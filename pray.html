<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>매일기도</title>
  <meta name="theme-color" content="#0f1123">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <style>
    :root {
      --bg: #0f1123; --card: #181c33; --surface: #202544;
      --text: #e8e9f0; --dim: #8b90a8;
      --gold: #d9b45b; --accent: #7aa2e8;
      --pray: #9d7ae8; --ans: #d9b45b;
      --line: rgba(255, 255, 255, 0.1);
      --tint-rgb: 255, 255, 255;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    :root[data-theme="light"] {
      --bg: #f6f4ec; --card: #fffdf6; --surface: #efe9da;
      --text: #22242b; --dim: #6b7080;
      --gold: #a9852f; --accent: #3f6bb5;
      --pray: #7752c9; --ans: #a9852f;
      --line: rgba(0, 0, 0, 0.1);
      --tint-rgb: 0, 0, 0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      min-height: 100dvh;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px; background: var(--bg); border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 17px; font-weight: 800; flex: 1; }
    .hbtn.appnav { padding: 5px 7px; font-size: 12px; opacity: 0.75; }
    .hbtn {
      background: none; border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 6px 10px; font-size: 14px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    main { padding: 12px 14px calc(84px + var(--safe-bottom)); max-width: 640px; margin: 0 auto; }
    .page { display: none; }
    .page.show { display: block; }

    .slot-sec { margin-bottom: 18px; }
    .slot-head, .grp-head {
      font-size: 14px; font-weight: 800; color: var(--gold);
      padding: 6px 2px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
    }
    .slot-cnt { font-weight: 400; color: var(--dim); font-size: 12px; margin-left: 4px; }
    /* 시간대 접기 — 마친 기도는 접어 두고 필요할 때 펼친다 */
    .slot-head[data-fold] { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .slot-head[data-fold] .slot-cnt { margin-left: auto; }
    .fold-tri { color: var(--dim); font-size: 11px; transition: transform 0.18s ease; }
    .slot-sec.folded .fold-tri { transform: rotate(-90deg); }
    .slot-sec.folded .slot-items { display: none; }
    .slot-sec.folded .slot-head { border-bottom-color: transparent; margin-bottom: 0; }
    .empty-line { color: var(--dim); font-size: 13px; text-align: center; padding: 10px 0; }

    .pray-row {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    }
    .pray-row.done { opacity: 0.55; }
    .pray-row.done .pray-title { text-decoration: line-through; }
    .chk {
      flex-shrink: 0; width: 26px; height: 26px; margin-top: 1px;
      border: 2px solid var(--gold); border-radius: 50%;
      background: none; color: var(--gold); font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .pray-main { flex: 1; min-width: 0; }
    .pray-title { font-size: 15px; font-weight: 700; line-height: 1.4; word-break: keep-all; }
    .pray-sub { font-size: 12px; color: var(--dim); margin-top: 3px; }
    .pray-promise { font-size: 12px; color: var(--accent); margin-top: 4px; line-height: 1.4; }
    .tag {
      display: inline-block; margin-left: 6px; padding: 1px 7px;
      border: 1px solid var(--line); border-radius: 20px;
      font-size: 10.5px; font-weight: 600; color: var(--dim); vertical-align: 1px;
    }
    .tag.st-answered { color: var(--ans); border-color: var(--ans); }
    .tag.st-waiting { color: var(--accent); }
    .tag.st-closed { opacity: 0.6; }
    .grp { margin-bottom: 16px; }

    .thanks-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .thanks-bar input {
      flex: 1; background: var(--card); border: 1px solid var(--line);
      color: var(--text); border-radius: 12px; padding: 11px 12px; font-size: 15px;
    }
    .thanks-bar button {
      background: var(--gold); color: #1c1608; border: none;
      border-radius: 12px; padding: 0 16px; font-size: 14px; font-weight: 800; cursor: pointer;
    }
    .thanks-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.5;
    }
    .mini-x { background: none; border: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 4px; }

    .cal-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 12px; }
    .cal-head b { font-size: 16px; }
    .cal-head button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
    #cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 11px; color: var(--dim); padding: 4px 0; }
    .cal-cell {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; gap: 3px;
    }
    .cal-cell.today { border-color: var(--gold); }
    .cds { display: flex; gap: 2px; min-height: 6px; }
    .cd { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
    .cd-pray { background: var(--pray); }
    .cd-ans { background: var(--ans); }
    .cal-legend { display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--dim); }
    .cal-legend i { margin-right: 4px; vertical-align: 1px; }
    #cal-sum { text-align: center; color: var(--dim); font-size: 13px; margin-top: 8px; }
    .cal-cell.picked { background: rgba(157, 122, 232, 0.16); border-color: var(--pray); }
    .cal-cell { cursor: pointer; }
    #cal-detail { margin-top: 12px; }
    .cd-date { font-size: 14px; font-weight: 800; margin-bottom: 7px; }
    .cd-slot {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 12px; margin-bottom: 6px; font-size: 13.5px; line-height: 1.5;
    }
    .cd-ans-line { border-left: 3px solid var(--ans); }

    /* 화면 맨 아래 고정 덩어리: 미니 플레이어 위 · 탭바 아래 */
    .bottom-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; }
    /* 🎵 기도찬양 미니 플레이어 — 탭바 바로 위 */
    #pm-bar {
      display: none;
      align-items: center; gap: 6px;
      padding: 7px 12px;
      background: var(--surface); border-top: 1px solid var(--line);
    }
    #pm-bar.show { display: flex; }
    #pm-bar button {
      background: none; border: none; color: var(--text);
      font-size: 16px; cursor: pointer; padding: 4px 6px; flex-shrink: 0;
    }
    #pm-play { color: var(--gold); font-size: 19px; }
    #pm-close { color: var(--dim); font-size: 14px; margin-left: 2px; }
    .pm-meta { flex: 1; min-width: 0; margin-left: 4px; }
    #pm-title {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #pm-sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
    /* 플레이어가 떠 있는 동안 본문 아래 여백을 넓혀 마지막 줄이 가리지 않게 */
    body.pm-on main { padding-bottom: calc(128px + var(--safe-bottom)); }
    body.pm-on #add-btn { bottom: calc(120px + var(--safe-bottom)); }

    /* ⏰ 알림 설정 줄 */
    .alarm-row {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 2px; border-bottom: 1px solid var(--line);
    }
    .alarm-row .an { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; }
    .alarm-row input[type="time"] {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px;
      padding: 5px 8px; font-size: 13px;
    }
    .alarm-row input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }

    .tabbar {
      display: flex; justify-content: space-around;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 8px 4px calc(8px + var(--safe-bottom));
    }
    .tabbar button {
      background: none; border: none; color: var(--dim); cursor: pointer;
      font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 10px;
    }
    .tabbar button .ico { font-size: 20px; }
    .tabbar button.on { color: var(--gold); font-weight: 700; }
    #add-btn {
      position: fixed; right: 16px; bottom: calc(76px + var(--safe-bottom)); z-index: 5;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--gold); color: #1c1608; border: none;
      font-size: 26px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .overlay {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: flex-end; justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }
    .overlay.show { display: flex; }
    .sheet {
      width: 100%; max-width: 640px; max-height: 88dvh; overflow-y: auto;
      background: var(--bg); border-radius: 18px 18px 0 0;
      padding: 18px 16px calc(20px + var(--safe-bottom));
    }
    .sheet h3 { font-size: 16px; margin-bottom: 12px; }
    .f-label { display: block; font-size: 12px; color: var(--dim); margin: 12px 2px 5px; }
    .sheet input[type="text"], .sheet textarea, .sheet select {
      width: 100%; background: var(--card); border: 1px solid var(--line);
      color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit;
    }
    .sheet textarea { min-height: 72px; resize: vertical; }
    .f-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #f-slots { display: flex; gap: 8px; }
    #f-slots button {
      flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--dim);
      border-radius: 10px; padding: 9px 0; font-size: 14px; cursor: pointer;
    }
    #f-slots button.on { border-color: var(--gold); color: var(--gold); font-weight: 700; }
    .f-secret-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; }
    .f-secret-row .hint { font-size: 11px; color: var(--dim); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
    .sheet-actions button {
      flex: 1; border: none; border-radius: 12px; padding: 12px 0; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .btn-ghost { background: var(--surface); color: var(--text); }
    .btn-gold { background: var(--gold); color: #1c1608; }

    #d-meta { margin: 6px 0 10px; }
    #d-meta .tag { margin-left: 0; margin-right: 6px; }
    #d-content { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; }
    .promise-box {
      margin-top: 12px; padding: 10px 12px; border-radius: 10px;
      background: rgba(var(--tint-rgb), 0.05); border-left: 3px solid var(--accent); font-size: 13px;
    }
    .promise-text { margin-top: 6px; line-height: 1.6; color: var(--text); }
    .answer-box {
      margin-top: 12px; padding: 10px 12px; border-radius: 10px;
      background: rgba(var(--tint-rgb), 0.05); border-left: 3px solid var(--ans); font-size: 14px; line-height: 1.6;
    }
    #d-dates { font-size: 12px; color: var(--dim); margin-top: 12px; }

    #pin-overlay .sheet { max-width: 380px; border-radius: 18px; margin-bottom: 20dvh; }
    #pin-overlay.show { align-items: center; }
    #pin-input { text-align: center; letter-spacing: 6px; font-size: 20px !important; }
    #pin-msg { font-size: 13px; color: var(--dim); line-height: 1.5; margin-bottom: 10px; }
    .pin-links { display: flex; justify-content: space-between; margin-top: 12px; }
    .pin-links button { background: none; border: none; color: var(--dim); font-size: 12px; text-decoration: underline; cursor: pointer; }

    #answered-filter {
      background: none; border: 1px solid var(--line); color: var(--dim);
      border-radius: 20px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; margin-bottom: 12px;
    }
    #answered-filter.on { border-color: var(--ans); color: var(--ans); font-weight: 700; }

    .attach-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
    .attach-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 7px 10px; font-size: 13px;
    }
    .attach-row .an { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .attach-row .as { color: var(--dim); font-size: 11px; }
    .attach-row .drive-ok { font-size: 11px; }
    .item-tags { margin-top: 4px; }
    .item-tags .htag {
      display: inline-block; margin-right: 5px; color: var(--accent); font-size: 11.5px; font-weight: 600;
    }
    .toast {
      position: fixed; left: 50%; bottom: calc(96px + var(--safe-bottom)); transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      padding: 10px 18px; border-radius: 24px; font-size: 13.5px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 40;
    }
    .toast.show { opacity: 1; }
      /* 보조창 오른쪽 위 ✕ 닫기 (js/tags.js가 자동으로 넣어 준다) */
    .sheet { position: relative; }
    .sheet-x {
      position: absolute; top: 10px; right: 12px; z-index: 2;
      background: none; border: none; color: var(--dim);
      font-size: 17px; line-height: 1; cursor: pointer; padding: 6px 8px;
    }
    .sheet-x:active { color: var(--text); }
    .sheet.has-sheet-x > h3 { padding-right: 34px; }
  </style>
</head>
<body>
  <header>
    <a class="hbtn" href="index.html" title="첫화면">🏠</a>
    <h1>🙏 매일기도</h1>
    <a class="hbtn appnav" href="praise.html" title="매일찬양"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#d9b45b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 21c-1.6-5.5-1.6-11.5 0-16.5"/><path d="M5.2 4.5C9 1.8 15 2 18.6 4.6"/><path d="M18.6 4.6c1.3 5.3 1.2 11-.3 16.4"/><path d="M4.2 21h15.2"/><path d="M8.3 6.2v14.8"/><path d="M11.6 5.4v15.6"/><path d="M14.9 5.4v15.6"/></svg></a>
    <a class="hbtn appnav" href="share.html" title="매일나눔">🤝</a>
    <button class="hbtn" id="praymusic-btn" title="기도찬양 재생/정지">🎵</button>
    <button class="hbtn" id="alarm-btn" title="기도시간 알림">⏰</button>
    <button class="hbtn" id="lock-btn" title="비밀기도 잠금/해제">🔒</button>
  </header>


  <main>
    <section class="page" id="page-today">
      <div id="today-body"></div>
    </section>

    <section class="page" id="page-list">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <button id="answered-filter" style="margin-bottom:0">🎉 응답의 기록만 보기</button>
        <button id="import-card-btn" style="background:none;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer">📥 카드 받기</button>
        <input type="file" id="import-card-file" accept=".json,application/json" hidden>
      </div>
      <div id="list-body"></div>
    </section>

    <section class="page" id="page-thanks">
      <div class="thanks-bar">
        <input id="thanks-input" placeholder="오늘의 감사를 한 줄로…" autocomplete="off">
        <button id="thanks-add">기록</button>
      </div>
      <div id="thanks-list"></div>
    </section>

    <section class="page" id="page-cal">
      <div class="cal-head">
        <button id="cal-prev">◀</button><b id="cal-title"></b><button id="cal-next">▶</button>
      </div>
      <div id="cal-grid"></div>
      <div class="cal-legend"><span><i class="cd cd-pray"></i>기도한 날</span><span><i class="cd cd-ans"></i>응답</span></div>
      <div id="cal-sum"></div>
      <div id="cal-detail"></div>
    </section>
  </main>

  <button id="add-btn" title="기도제목 추가">＋</button>

  <!-- 화면 맨 아래 고정: 기도찬양 미니 플레이어 + 탭바를 한 덩어리로 쌓는다.
       (둘 사이 간격을 픽셀로 짐작하지 않도록 같은 상자에 담았다) -->
  <div class="bottom-dock">
    <div id="pm-bar">
      <button id="pm-prev" title="이전 곡">⏮</button>
      <button id="pm-play" title="재생/일시정지">⏸</button>
      <button id="pm-next" title="다음 곡">⏭</button>
      <div class="pm-meta">
        <div id="pm-title"></div>
        <div id="pm-sub"></div>
      </div>
      <button id="pm-close" title="기도찬양 끄기">✕</button>
    </div>
    <nav class="tabbar">
      <button data-tab="today"><span class="ico">🙏</span>오늘의 기도</button>
      <button data-tab="list"><span class="ico">📋</span>기도제목</button>
      <button data-tab="thanks"><span class="ico">🧡</span>감사노트</button>
      <button data-tab="cal"><span class="ico">📅</span>달력</button>
    </nav>
  </div>

  <!-- 상세 -->
  <div class="overlay" id="detail-overlay">
    <div class="sheet">
      <h3 id="d-title"></h3>
      <div id="d-meta"></div>
      <div id="d-content"></div>
      <div id="d-promise"></div>
      <div id="d-attach" class="attach-list" style="margin-top:10px"></div>
      <div id="d-answer"></div>
      <div id="d-dates"></div>
      <div class="sheet-actions">
        <button class="btn-ghost" id="d-del-btn">삭제</button>
        <button class="btn-ghost" id="d-edit-btn">수정</button>
        <button class="btn-gold" id="d-answer-btn">🎉 응답 기록</button>
      </div>
      <div class="sheet-actions">
        <button class="btn-ghost" id="d-sharecard">💌 기도카드 전달</button>
        <button class="btn-ghost" id="d-close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 추가/수정 -->
  <div class="overlay" id="form-overlay">
    <div class="sheet">
      <h3 id="form-title">기도제목 추가</h3>
      <div class="f-2col">
        <div><label class="f-label">기도의 대상</label><select id="f-target"></select></div>
        <div><label class="f-label">기도의 내용</label><select id="f-type"></select></div>
      </div>
      <label class="f-label">제목</label>
      <input type="text" id="f-title" placeholder="예) ○○의 건강 회복" autocomplete="off">
      <label class="f-label">내용 (선택)</label>
      <textarea id="f-content" placeholder="기도의 자세한 내용…"></textarea>
      <label class="f-label">약속말씀 장절 (선택)</label>
      <input type="text" id="f-pref" placeholder="예) 요 15:7 (개역한글)" autocomplete="off">
      <label class="f-label">약속말씀 본문 (선택)</label>
      <textarea id="f-ptext" placeholder="붙들고 기도할 말씀…"></textarea>
      <label class="f-label">해시태그 <span style="font-size:11px;color:var(--dim)">(비우면 제목·내용에서 자동 추출)</span></label>
      <input type="text" id="f-tags" placeholder="#가족 #건강" autocomplete="off">
      <label class="f-label">첨부파일 <span style="font-size:11px;color:var(--dim)">(사진·문서 등, 이 기기에 저장)</span></label>
      <div id="f-attach-list" class="attach-list"></div>
      <input type="file" id="f-files" multiple>
      <label class="f-label">기도 시간</label>
      <div id="f-slots">
        <button type="button" data-slot="dawn">🌅 새벽</button>
        <button type="button" data-slot="noon">☀️ 점심</button>
        <button type="button" data-slot="eve">🌙 저녁/밤</button>
      </div>
      <div class="f-secret-row">
        <input type="checkbox" id="f-secret">
        <label for="f-secret">🔒 은밀한 기도 (암호화 저장)</label>
        <span class="hint">— PIN으로만 열람</span>
      </div>
      <div class="sheet-actions">
        <button class="btn-ghost" id="form-cancel">취소</button>
        <button class="btn-gold" id="form-save">저장</button>
      </div>
    </div>
  </div>

  <!-- PIN -->
  <div class="overlay" id="pin-overlay">
    <div class="sheet">
      <h3>🔒 비밀기도</h3>
      <div id="pin-msg"></div>
      <input type="password" id="pin-input" inputmode="numeric" autocomplete="off">
      <div class="sheet-actions">
        <button class="btn-ghost" id="pin-cancel">취소</button>
        <button class="btn-gold" id="pin-ok">열기</button>
      </div>
      <div class="pin-links">
        <button id="pin-change">PIN 변경</button>
        <button id="pin-forgot">PIN을 잊었어요</button>
      </div>
    </div>
  </div>

  <!-- ⏰ 기도시간 알림 -->
  <div class="overlay" id="alarm-overlay">
    <div class="sheet">
      <h3>⏰ 기도시간 알림</h3>
      <div style="font-size:12.5px;color:var(--dim);line-height:1.55;margin:6px 0 12px">
        정해 둔 시각에 매일 알려 드립니다. 알림을 누르면 기도 화면이 열립니다.
      </div>
      <div id="alarm-list"></div>
      <div id="alarm-status" style="font-size:12px;color:var(--dim);margin-top:10px"></div>
      <div class="sheet-actions">
        <button class="btn-ghost" id="alarm-cancel">취소</button>
        <button class="btn-gold" id="alarm-save">저장</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/tags.js?v=8"></script>
  <script src="js/attach-store.js?v=3"></script>
  <script src="js/card-exchange.js?v=2"></script>
  <script src="js/pray-store.js?v=5"></script>
  <script src="js/praise-store.js?v=7"></script>
  <script src="js/pray-app.js?v=12"></script>
</body>
</html>
